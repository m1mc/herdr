name: Upstream Sync and Rootshell Release

on:
  schedule:
    - cron: "0 2 * * 1" # Weekly every Monday at 02:00 UTC
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: "Sync master and tags from upstream kitknox/herdr"
        type: boolean
        required: false
        default: true
      merge_to_rootshell:
        description: "Merge upstream master into arm64-rootshell branch"
        type: boolean
        required: false
        default: true
      trigger_release:
        description: "Bump tag and trigger multiplatform release if new commits exist"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  sync-and-release:
    name: Sync Upstream & Trigger Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arm64-rootshell
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/kitknox/herdr.git || true

      - name: Fetch Upstream
        run: |
          git fetch upstream master --tags

      - name: Sync Master
        if: github.event_name == 'schedule' || inputs.sync_upstream == true
        run: |
          git push origin refs/remotes/upstream/master:refs/heads/master --tags || true

      - name: Check for new commits & Merge to arm64-rootshell
        id: merge
        run: |
          ahead_count=$(git rev-list --count HEAD..upstream/master || echo 0)
          echo "ahead_count=$ahead_count"
          if [ "$ahead_count" -gt 0 ] && [ "${{ inputs.merge_to_rootshell != false }}" = "true" ]; then
            echo "Upstream is ahead by $ahead_count commits. Merging upstream/master into arm64-rootshell..."
            git merge --no-edit -m "chore: integrate upstream changes ($ahead_count commits)" upstream/master
            git push origin arm64-rootshell
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new upstream commits to merge."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump Tag and Trigger Multiplatform Release
        if: (steps.merge.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch') && (inputs.trigger_release == true || github.event_name == 'schedule')
        run: |
          base_ver=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f2)
          latest_tag=$(git tag -l "v*-rootshell.*" | sort -V | tail -n 1 || echo "")
          echo "Latest tag found: $latest_tag"

          next_id="0.1.14"
          if [[ "$latest_tag" =~ ^v.*-rootshell\.([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            maj="${BASH_REMATCH[1]}"
            min="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            next_patch=$((patch + 1))
            next_id="${maj}.${min}.${next_patch}"
          fi

          new_tag="v${base_ver}-rootshell.${next_id}"
          echo "Creating new release tag: $new_tag"
          git tag "$new_tag"
          git push origin "$new_tag"
