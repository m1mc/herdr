name: Windows ARM64 Sync and Release

on:
  schedule:
    - cron: "0 2 * * 1" # Weekly every Monday at 02:00 UTC
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: "Sync master and tags from upstream kitknox/herdr"
        type: boolean
        required: false
        default: true
      build_release:
        description: "Build Windows ARM64 release"
        type: boolean
        required: false
        default: true
      release_tag:
        description: "Release tag to publish (leave empty for snapshot or ref tag)"
        required: false
        default: ""
  push:
    tags:
      - "v*-rootshell.*"
      - "v*-arm64.*"

permissions:
  contents: write

jobs:
  sync-upstream:
    name: Sync Master from Upstream
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.sync_upstream == true || github.event.inputs.sync_upstream == 'true'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync master and tags from kitknox/herdr
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/kitknox/herdr.git || true
          git fetch upstream master:master --tags
          git push origin master:master --tags

  build-arm64:
    name: Build Windows ARM64 (Native / Cross)
    needs: [sync-upstream]
    if: always() && !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule' || inputs.build_release == true || github.event.inputs.build_release == 'true')
    runs-on: windows-latest
    env:
      RUST_TOOLCHAIN: 1.96.1
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-pc-windows-msvc

      - name: Install Zig
        uses: vercel-labs/setup-zig@v1.0.2
        with:
          version: 0.16.0

      - name: Clean Zig Cache
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/.zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/zig-out -ErrorAction SilentlyContinue

      - name: Build herdr (aarch64-pc-windows-msvc)
        shell: pwsh
        run: |
          $env:ZIG = (Get-Command zig).Source
          $tag = if ("${{ github.event.inputs.release_tag }}" -ne "") { "${{ github.event.inputs.release_tag }}" } elseif ("${{ github.ref_name }}" -match "^v") { "${{ github.ref_name }}" } else { "snapshot" }
          if ($tag -match "^v(?<base>[^-]+)-rootshell\.(?<id>.+)$") {
              $env:HERDR_BUILD_CHANNEL = "rootshell"
              $env:HERDR_BUILD_ID = $Matches.id
          }
          cargo build --release --locked --target aarch64-pc-windows-msvc

      - name: Stage ConPTY & Package Zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = if ("${{ github.event.inputs.release_tag }}" -ne "") { "${{ github.event.inputs.release_tag }}" } elseif ("${{ github.ref_name }}" -match "^v") { "${{ github.ref_name }}" } else { "snapshot" }
          $stage = Join-Path $env:RUNNER_TEMP "stage-aarch64"
          $nupkg = Join-Path $env:RUNNER_TEMP "conpty.nupkg"
          $zipName = "herdr-$tag-aarch64-pc-windows-msvc.zip"
          python scripts/package_windows_conpty.py stage `
            --architecture aarch64 `
            --package $nupkg `
            --herdr-exe target/aarch64-pc-windows-msvc/release/herdr.exe `
            --output-dir $stage
          Compress-Archive -Path "$stage/*" -DestinationPath $zipName -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zipName).Hash.ToLowerInvariant()
          "$hash  $zipName" | Out-File -Encoding utf8 SHA256SUMS.txt

          $baseVer = "0.9.5"
          $buildId = "0.1.10"
          if ($tag -match "^v(?<base>[^-]+)-rootshell\.(?<id>.+)$") {
              $baseVer = $Matches.base
              $buildId = $Matches.id
          }
          $manifest = [ordered]@{
              base_version = $baseVer
              version = $buildId
              notes = "Native Windows ARM64 release with ConPTY cursor alignment fix and auto-update support."
              assets = @{
                  "windows-aarch64" = @{
                      url = "https://github.com/m1mc/herdr/releases/download/$tag/$zipName"
                      sha256 = $hash
                      format = "zip"
                  }
              }
              sha256 = @{
                  "windows-aarch64" = $hash
              }
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8 distribution/rootshell.json

          echo "ZIP_PATH=$zipName" >> $env:GITHUB_ENV
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event.inputs.release_tag != '' && github.event.inputs.release_tag != 'snapshot')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ env.ZIP_PATH }}
            SHA256SUMS.txt
            distribution/rootshell.json
          body: |
            ## Herdr Windows ARM64 (Native Release with ConPTY Fix)

            - Built for `aarch64-pc-windows-msvc`
            - Bundles native ARM64 `conpty.dll` and `arm64\OpenConsole.exe`
            - Includes fix for Windows ConPTY terminal resize cursor drift (`PageList.zig`)
            - Integrated with `rootshell.json` for seamless `herdr update` auto-updates
