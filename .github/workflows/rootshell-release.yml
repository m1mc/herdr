name: Rootshell multiplatform release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v0.9.5-rootshell.0.1.12)"
        required: true
        default: ""
  push:
    tags:
      - "rootshell-v*"
      - "v*-rootshell.*"

permissions:
  contents: write

concurrency:
  group: rootshell-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1
  LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
  LIBGHOSTTY_VT_SIMD: 'true'

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: herdr-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: herdr-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            name: herdr-windows-x86_64.zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            name: herdr-windows-aarch64.zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          submodules: recursive

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - uses: vercel-labs/setup-zig@v1.0.2
        with:
          version: 0.16.0

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Remove Zig caches
        shell: bash
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tag="${{ github.event.inputs.release_tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME:-v0.9.5-rootshell.0.1.12}"; fi
          if [[ "$tag" =~ ^rootshell-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            export HERDR_BUILD_CHANNEL=rootshell
            export HERDR_BUILD_ID="${BASH_REMATCH[1]}"
          elif [[ "$tag" =~ ^v[^-]+-rootshell\.([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            export HERDR_BUILD_CHANNEL=rootshell
            export HERDR_BUILD_ID="${BASH_REMATCH[1]}"
          else
            export HERDR_BUILD_CHANNEL=rootshell
            export HERDR_BUILD_ID="0.1.12"
          fi
          export HERDR_BUILD_COMMIT="$(git rev-parse HEAD)"
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ZIG = (Get-Command zig).Source
          $tag = if ("${{ github.event.inputs.release_tag }}" -ne "") { "${{ github.event.inputs.release_tag }}" } elseif ("${{ github.ref_name }}" -match "^v") { "${{ github.ref_name }}" } else { "v0.9.5-rootshell.0.1.12" }
          if ($tag -match "^v(?<base>[^-]+)-rootshell\.(?<id>.+)$") {
              $env:HERDR_BUILD_CHANNEL = "rootshell"
              $env:HERDR_BUILD_ID = $Matches.id
          } elseif ($tag -match "^rootshell-v(?<id>.+)$") {
              $env:HERDR_BUILD_CHANNEL = "rootshell"
              $env:HERDR_BUILD_ID = $Matches.id
          }
          $env:HERDR_BUILD_COMMIT = (git rev-parse HEAD)
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          exe="target/${{ matrix.target }}/release/herdr"
          cp "$exe" "${{ matrix.name }}"
          chmod +x "${{ matrix.name }}"
          shasum -a 256 "${{ matrix.name }}" > "${{ matrix.name }}.sha256"

          # Package tar.gz for mise/ubi universal binary consumption
          tar_name="${{ matrix.name }}.tar.gz"
          tar -czf "$tar_name" -C "target/${{ matrix.target }}/release" herdr
          shasum -a 256 "$tar_name" > "$tar_name.sha256"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $arch = if ("${{ matrix.target }}" -like "*aarch64*") { "aarch64" } else { "x86_64" }
          $stage = Join-Path $env:RUNNER_TEMP "stage-$arch"
          $nupkg = Join-Path $env:RUNNER_TEMP "conpty.nupkg"
          python scripts/package_windows_conpty.py stage `
            --architecture $arch `
            --package $nupkg `
            --herdr-exe target/${{ matrix.target }}/release/herdr.exe `
            --output-dir $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "${{ matrix.name }}" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.name }}").Hash.ToLowerInvariant()
          "$hash  ${{ matrix.name }}" | Out-File -Encoding ascii "${{ matrix.name }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare installer and update manifest
        run: |
          python3 -m unittest scripts.test_rootshell_release scripts.test_rootshell_sync
          cp scripts/rootshell-install.sh release-assets/install.sh
          cp distribution/install.ps1 release-assets/install.ps1
          tag="${{ github.event.inputs.release_tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME:-v0.9.5-rootshell.0.1.12}"; fi
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_REF_NAME="$tag" python3 scripts/rootshell-manifest.py
          cat release-assets/rootshell.json

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ${{ github.event.inputs.release_tag || github.ref_name }}
          make_latest: true
          generate_release_notes: true
          body: |
            ## Herdr Multiplatform Rootshell Release

            Features:
            - **URL Click Browser Spawn**: Preserves terminal OSC 8 hyperlinks and dispatches safe web URLs while the original click target remains valid.
            - **Windows ARM64 Native**: First-class support for `aarch64-pc-windows-msvc` with ConPTY integration.
            - **Multiplatform Packages**: Built for macOS (Apple Silicon + Intel), Ubuntu/Linux (x86_64 + aarch64), and Windows 11 (x64 + arm64).

            ### Install and Upgrade:

            #### 1. macOS & Ubuntu (`mise`)
            ```bash
            mise use -g ubi:m1mc/herdr@latest
            # or upgrade anytime:
            mise upgrade herdr
            ```

            #### 2. macOS & Linux (Shell Installer)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/m1mc/herdr/arm64-rootshell/scripts/rootshell-install.sh | sh
            ```

            #### 3. Windows 11 (PowerShell Installer for x86_64 & ARM64)
            ```powershell
            irm https://raw.githubusercontent.com/m1mc/herdr/arm64-rootshell/distribution/install.ps1 | iex
            ```

            #### 4. In-App Auto-Update (All platforms)
            Run `herdr update` from your terminal to update in-place.
          files: release-assets/*

      - name: Publish fork update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/rootshell-manifest.py --promote
